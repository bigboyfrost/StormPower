<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SP Toggle</title>
  <style>
    html, body {
      margin: 0;
      width: 64px;
      height: 64px;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", sans-serif;
      -webkit-app-region: no-drag;
    }
    button {
      width: 60px;
      height: 60px;
      margin: 2px;
      border: 2px solid rgba(100, 180, 255, 0.55);
      border-radius: 18px;
      background: #0a0a0a;
      box-shadow: 0 10px 28px rgba(0, 20, 50, 0.55);
      color: #7cc8ff;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: -0.02em;
      cursor: pointer;
    }
    button:hover { transform: scale(1.04); }
    button.open {
      background: #123a66;
      color: #e8f4ff;
      border-color: #4db4ff;
    }
    button span {
      display: block;
      font-size: 9px;
      font-weight: 600;
      opacity: 0.85;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <button id="btn" type="button" title="Show / hide StormPower menu">
    SP
    <span id="hint">show</span>
  </button>
  <script>
    const btn = document.getElementById("btn");
    const hint = document.getElementById("hint");
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (window.stormpower) window.stormpower.toggleMenu();
    });
    if (window.stormpower) {
      window.stormpower.onState((s) => {
        const open = !!s.open;
        btn.classList.toggle("open", open);
        hint.textContent = open ? "hide" : "show";
      });
    }
  </script>
</body>
</html>
