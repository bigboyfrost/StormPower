<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StormPower</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="shell" class="shell">
    <div class="drag-bar" title="Drag to move">
      <span class="drag-title">StormPower</span>
      <span class="drag-hint">Drag onto another monitor</span>
    </div>

    <header class="hero compact">
      <div class="hero-text">
        <p class="eyebrow">Aimless Developement</p>
        <h1>StormPower</h1>
      </div>
      <div class="hero-meta">
        <span id="linkStatus" class="pill warning">Waiting for game</span>
        <span id="versionPill" class="pill quiet">v—</span>
      </div>
    </header>

    <div id="updateBanner" class="update-banner sticky hidden">
      <span id="updateText">Update available</span>
      <button id="updateBtn" type="button">Update now</button>
    </div>

    <section class="card settings-card slim">
      <div class="controls">
        <div class="control">
          <div class="control-label">
            <span>Spawn distance</span>
            <strong id="distValue">20 m</strong>
          </div>
          <input id="dist" type="range" min="1" max="5000" value="20" />
        </div>
        <div class="row2">
          <div class="control">
            <div class="control-label">
              <span>Amount</span>
              <strong id="countValue">5</strong>
            </div>
            <input id="count" type="range" min="1" max="50" value="5" />
          </div>
          <div class="control">
            <div class="control-label">
              <span>Scale</span>
              <strong id="sizeValue">1.0×</strong>
            </div>
            <input id="size" type="range" min="1" max="40" value="2" />
          </div>
        </div>
      </div>
    </section>

    <section class="card menu-card">
      <div class="search-row">
        <input id="search" type="search" placeholder="Search everything…" autocomplete="off" spellcheck="false" />
      </div>
      <div class="menu-toolbar">
        <button type="button" id="backBtn" class="back-btn">‹ Back</button>
        <div class="breadcrumb" id="path">Home</div>
        <div class="toolbar-actions">
          <button type="button" id="popOutBtn" class="tool-btn" title="Detach and drag to another monitor">Pop out</button>
        </div>
      </div>
      <ul id="list" class="list"></ul>
      <div id="lastAction" class="last-action"></div>
    </section>

    <footer class="footer">
      <div class="keys">
        <span><kbd>F4</kbd> toggle</span>
        <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
        <span><kbd>↵</kbd> select</span>
        <span><kbd>⌫</kbd> back</span>
      </div>
      <p class="credit">StormPower · Aimless Developement</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
